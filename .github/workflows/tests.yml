name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testthat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: Rscript -e 'install.packages(c("randomForest", "testthat"))'
      - name: Check that the saved model matches train_model.R
        run: |
          Rscript train_model.R
          git diff --exit-code data/test_data.csv
      - name: Unit tests
        run: Rscript tests/testthat.R
