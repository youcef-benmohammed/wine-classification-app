# Creates the git tag and GitHub release for the version in VERSION when it
# lands on main (e.g. VERSION = 0.2 -> tag v0.2), with notes from CHANGELOG.md.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag the original version (v0.1) if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse -q --verify refs/tags/v0.1 >/dev/null; then
            git tag v0.1 23062de259b385f29c956891739c921c851fafaf
            git push origin v0.1
            gh release create v0.1 --title "v0.1" \
              --notes "Original version of the app (before the fixes listed in v0.2)."
          fi

      - name: Tag and release the current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(cat VERSION)"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version already exists"; exit 0
          fi
          awk -v v="$(cat VERSION)" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          git tag "$version"
          git push origin "$version"
          gh release create "$version" --title "$version" --notes-file notes.md
